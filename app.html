<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Storyboard Helper</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div>
    <h1>Movie Storyboard Helper</h1>
    <p class="sub">제품 이미지 + 상품 URL → 시작/끝 프레임 프롬프트와 스토리보드(한글/영문)</p>
  </div>
  <button id="btnSettings" class="ghost" type="button">⚙ 설정</button>
</header>

<main class="layout">
  <section class="panel" aria-labelledby="h-input">
    <h2 id="h-input">1. 입력</h2>

    <label class="field">
      <span>출력 모드</span>
      <select id="mode">
        <option value="video">영상 스토리보드 (시작/끝 프레임 + 장면 프롬프트)</option>
        <option value="photos">스토리 사진 세트 (이야기처럼 이어지는 사진 컷)</option>
        <option value="poster">포스터 (한 장짜리 광고 이미지)</option>
      </select>
    </label>

    <label class="field">
      <span>상품 URL</span>
      <input id="url" type="url" placeholder="https://... (상품 상세 페이지)">
      <small>페이지 제목·설명·본문 일부를 읽어 제품 정보를 파악합니다. 읽기에 실패하면 아래 요청사항에 직접 적어 주세요.</small>
    </label>

    <div class="field">
      <span>제품/모델 이미지 (최대 4장)</span>
      <div id="drop" class="drop" tabindex="0" role="button" aria-label="이미지 선택 또는 끌어다 놓기">
        이미지를 끌어다 놓거나 클릭해서 선택
        <input id="files" type="file" accept="image/*" multiple hidden>
      </div>
      <div id="thumbs" class="thumbs"></div>
      <label class="check"><input id="useOg" type="checkbox" checked> 이미지를 올리지 않으면 상품 페이지 대표 이미지(og:image)를 자동 사용</label>
    </div>

    <label class="field">
      <span>요청사항 (선택)</span>
      <textarea id="brief" rows="4" placeholder="예) 올려 둔 인물 사진의 여성이 주인공. 아침 출근 전 주방에서 시원한 물을 마시며 하루를 시작하는 이야기. 가격 문구는 넣지 않기."></textarea>
      <small>인물 사진을 함께 올리면 그 사람을 주인공으로 일관되게 사용합니다. 본인이거나 사용 동의를 받은 사진, 또는 AI로 만든 가상 인물만 사용하세요.</small>
    </label>

    <div class="grid3">
      <label class="field"><span id="lblCount">장면 수</span>
        <select id="sceneCount"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select>
      </label>
      <label class="field" id="fldClip"><span>클립 길이</span>
        <select id="clipSec"><option value="4">4초</option><option value="6">6초</option><option value="8" selected>8초</option></select>
      </label>
      <label class="field"><span>화면 비율</span>
        <select id="ratio">
          <option value="9:16" selected>9:16 인스타 스토리/릴스</option>
          <option value="4:5">4:5 인스타 피드</option>
          <option value="1:1">1:1 정사각형</option>
          <option value="16:9">16:9 가로</option>
          <option value="3:4">3:4 세로(포스터용)</option>
        </select>
      </label>
    </div>

    <fieldset id="posterFields" class="poster-box" hidden>
      <legend>포스터 문구 (비우면 AI가 제안, 가격·혜택은 직접 입력 권장)</legend>
      <label class="field"><span>헤드라인</span><input id="pHead" type="text" placeholder="예) 작지만, 시원한 변화"></label>
      <label class="field"><span>서브 카피</span><input id="pSub" type="text" placeholder="예) 주방 한켠, 작지만 시원하게"></label>
      <label class="field"><span>가격 문구</span><input id="pPrice" type="text" placeholder="예) 월 3,900원 (제휴카드 할인 적용 시)"></label>
      <label class="field"><span>프로모션 문구</span><input id="pPromo" type="text" placeholder="예) 의무 5·6·7년 반값 할인"></label>
      <label class="field"><span>하단 안내 문구</span><input id="pFoot" type="text" placeholder="예) ※ 제휴카드 혜택가는 렌탈사 최대 할인 기준입니다"></label>
      <label class="check"><input id="pText" type="checkbox" checked> 문구를 이미지 안에 넣기 (끄면 문구 자리만 비워 둔 이미지를 만들어, 글자는 나중에 얹어요)</label>
    </fieldset>

    <label class="field" id="fldDialogue"><span>대사</span>
      <select id="dialogue">
        <option value="ko" selected>한국어 대사 포함</option>
        <option value="en">영어 대사 포함</option>
        <option value="none">대사 없음 (사운드/음악만)</option>
      </select>
    </label>

    <label class="field"><span>분위기/스타일</span>
      <select id="tone">
        <option>밝고 깨끗한 라이프스타일</option>
        <option>시네마틱 영화 예고편</option>
        <option>미니멀 프리미엄 광고</option>
        <option>귀엽고 따뜻한 미니어처/캐릭터</option>
        <option>감성 브이로그</option>
      </select>
    </label>

    <button id="btnRun" class="primary" type="button">스토리보드 만들기</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>

  <section class="panel result" aria-labelledby="h-out">
    <div class="rowhead">
      <h2 id="h-out">2. 결과</h2>
      <div class="actions">
        <button id="btnCopyAll" class="ghost" type="button" disabled>전체 복사</button>
        <button id="btnMd" class="ghost" type="button" disabled>.md 저장</button>
        <button id="btnJson" class="ghost" type="button" disabled>.json 저장</button>
      </div>
    </div>
    <div id="empty" class="empty">왼쪽에서 입력하고 "스토리보드 만들기"를 누르세요.</div>
    <div id="out" hidden></div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" class="dlgbody" id="settingsForm">
    <h2>설정</h2>
    <label class="field"><span>AI 제공자</span>
      <select id="provider">
        <option value="gemini">Google Gemini</option>
        <option value="claude">Anthropic Claude</option>
      </select>
    </label>
    <label class="field"><span>API 키</span>
      <input id="apiKey" type="password" autocomplete="off" placeholder="선택한 제공자의 API 키">
      <small>이 브라우저의 확장 저장소(chrome.storage.local)에만 저장되고, 선택한 제공자 API 호출에만 사용됩니다. 공용 PC에서는 사용 후 지우세요.</small>
    </label>
    <label class="field"><span>모델명</span>
      <input id="model" type="text" placeholder="gemini-2.5-flash">
      <small>Gemini 기본: gemini-2.5-flash · Claude 예: claude-sonnet-5-5</small>
    </label>
    <hr class="sep">
    <h3 class="sub-h">프레임 이미지 생성 (Gemini)</h3>
    <label class="field"><span>이미지 모델명</span>
      <input id="imageModel" type="text" placeholder="gemini-3.1-flash-image">
      <small>이미지 생성은 Gemini 이미지 모델만 지원하며 호출할 때마다 과금됩니다.</small>
    </label>
    <label class="field"><span>이미지용 Gemini API 키 (선택)</span>
      <input id="imageKey" type="password" autocomplete="off" placeholder="비워 두면 위 API 키를 사용 (제공자가 Gemini일 때)">
      <small>AI 제공자를 Claude로 쓰는 경우에만 필요합니다.</small>
    </label>
    <label class="field"><span>이미지 해상도</span>
      <select id="imageSize"><option value="1K">1K (저렴)</option><option value="2K">2K (선명, 더 비쌈)</option></select>
      <small>1K 약 $0.067, 2K 약 $0.10 (gemini-3.1-flash-image 공식 가격 기준, 변동 가능)</small>
    </label>
    <div class="dlgactions">
      <button value="cancel" class="ghost" type="submit">닫기</button>
      <button id="btnSave" class="primary" value="save" type="submit">저장</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
